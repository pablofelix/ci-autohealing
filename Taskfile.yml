version: '3'

vars:
  IMAGE: ic-server
  TAG: latest
  CONTAINER: ci-autohealing-server
  DB_CONTAINER: ci-autohealing-db
  K8S_DIR: k8s
  SRC_DIR: src
  PORT: 8000

tasks:

  # ===========================================================================
  # Development
  # ===========================================================================

  test:
    desc: Run test suite (unit + security, skipping slow)
    preconditions:
      - sh: command -v python3
        msg: |
          python3 is not installed.
          Install: sudo dnf install python3  (RHEL/Fedora)
                   sudo apt install python3  (Debian/Ubuntu)
    cmds:
      - python3 -m pytest src/tests/ -x -q --ignore=src/tests/e2e -m "not slow" {{.CLI_ARGS}}

  test-unit:
    desc: Run unit tests only (fast, <30s)
    cmds:
      - python3 -m pytest src/tests/ -x -q --ignore=src/tests/e2e -m "not slow" --tb=short

  test-integration:
    desc: Run integration tests (requires DB/API)
    cmds:
      - python3 -m pytest src/tests/ -x -q -m "integration" --tb=short

  test-security:
    desc: Run security tests
    cmds:
      - python3 -m pytest src/tests/test_security_*.py -x -q --tb=short

  test-e2e:
    desc: Run Gherkin e2e tests
    cmds:
      - python3 -m pytest src/tests/e2e/ -x -q --tb=short

  test-full:
    desc: Run all tests with coverage
    cmds:
      - |
        mkdir -p .test-results
        python3 -m pytest src/tests/ --cov --cov-report=term \
          --cov-report=html:.test-results/htmlcov \
          --cov-report=json:.test-results/coverage.json \
          -q {{.CLI_ARGS}}

  coverage:
    desc: Show current coverage report
    cmds:
      - python3 -m pytest src/tests/ --cov --cov-report=term -q --tb=no

  coverage-check:
    desc: Fail if coverage below threshold (default 85%)
    cmds:
      - python3 -m pytest src/tests/ --cov --cov-fail-under={{.COV_MIN | default "85"}} -q --tb=no

  test-playwright:
    desc: Run Playwright E2E tests for the system map frontend
    dir: map/frontend
    cmds:
      - npx playwright test {{.CLI_ARGS}}

  test-playwright-headed:
    desc: Run Playwright tests in headed browser (visible)
    dir: map/frontend
    cmds:
      - npx playwright test --headed {{.CLI_ARGS}}

  test-map:
    desc: Run all map tests (pytest BDD + Playwright E2E)
    cmds:
      - python3 -m pytest map/tests/ -x -q --tb=short --ignore=map/tests/test_e2e_system_map.py
      - cd map/frontend && npx playwright test

  test-watchdog:
    desc: Start file-watching test daemon
    cmds:
      - bash scripts/test-watchdog.sh watch

  test-watchdog-stop:
    desc: Stop the test watchdog daemon
    cmds:
      - bash scripts/test-watchdog.sh stop

  test-watchdog-status:
    desc: Check if test watchdog is running
    cmds:
      - bash scripts/test-watchdog.sh status

  lint:
    desc: Run ruff linter
    dir: "{{.SRC_DIR}}"
    preconditions:
      - sh: command -v ruff
        msg: |
          ruff is not installed.
          Install: pip install ruff
    cmds:
      - ruff check . {{.CLI_ARGS}}

  check:
    desc: Run lint + tests
    deps: [lint]
    cmds:
      - task: test

  # ===========================================================================
  # Docker
  # ===========================================================================

  build:
    desc: Build Docker image
    preconditions:
      - sh: command -v docker || command -v podman
        msg: |
          Neither docker nor podman is installed.
          Install docker:  https://docs.docker.com/engine/install/
          Install podman:  sudo dnf install podman  (RHEL/Fedora)
    cmds:
      - docker build -t {{.IMAGE}}:{{.TAG}} .
    sources:
      - Dockerfile
      - src/requirements.txt
      - src/**/*.py

  up:
    desc: Start all services (server + PostgreSQL) and apply migrations
    deps: [build]
    preconditions:
      - sh: docker info > /dev/null 2>&1 || podman info > /dev/null 2>&1
        msg: |
          Docker/podman daemon is not running.
          Start it: sudo systemctl start docker
              or:   systemctl --user start podman
    cmds:
      - docker compose up -d || podman-compose up -d
      - task: db:migrate

  down:
    desc: Stop all services
    cmds:
      - docker compose down || podman-compose down 2>/dev/null || true

  restart:
    desc: Rebuild and restart server
    cmds:
      - task: down
      - task: up

  logs:
    desc: Show server logs (follow)
    cmds:
      - docker logs -f {{.CONTAINER}} 2>&1 || podman logs -f {{.CONTAINER}} 2>&1

  shell:
    desc: Open shell in running server container
    cmds:
      - docker exec -it {{.CONTAINER}} /bin/sh

  # ===========================================================================
  # Run locally (without Docker)
  # ===========================================================================

  serve:
    desc: Run API + MCP server locally
    dir: "{{.SRC_DIR}}"
    cmds:
      - python3 -m serve --api --mcp-sse --port {{.PORT}}

  serve:api:
    desc: Run REST API only (local)
    dir: "{{.SRC_DIR}}"
    cmds:
      - python3 -m serve --api --port {{.PORT}}

  serve:mcp:
    desc: Run MCP server stdio (local, for Claude Desktop)
    dir: "{{.SRC_DIR}}"
    cmds:
      - python3 -m serve --mcp

  worker:
    desc: Run worker pipeline (collect → analyze → fix loop)
    dir: "{{.SRC_DIR}}"
    cmds:
      - python3 -m worker

  watch:
    desc: Start K8s watch daemon (event-driven monitoring)
    dir: "{{.SRC_DIR}}"
    cmds:
      - python3 -m watcher

  # ===========================================================================
  # Kubernetes
  # ===========================================================================

  deploy:
    desc: Deploy to Kubernetes cluster
    preconditions:
      - sh: command -v kubectl
        msg: |
          kubectl is not installed.
          Install: curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                   chmod +x kubectl && mv kubectl ~/.local/bin/
      - sh: kubectl cluster-info > /dev/null 2>&1
        msg: |
          No Kubernetes cluster available.
          Options:
            - Configure kubectl to point to your cluster: export KUBECONFIG=~/.kube/config
            - Create a local cluster with kind: task kind:create
            - Check current context: kubectl config current-context
    cmds:
      - kubectl apply -f {{.K8S_DIR}}/namespace.yml
      - kubectl apply -f {{.K8S_DIR}}/configmap.yml
      - kubectl apply -f {{.K8S_DIR}}/secret.yml
      - kubectl apply -f {{.K8S_DIR}}/deployment.yml
      - kubectl apply -f {{.K8S_DIR}}/service.yml
      - echo "Deployed. Check status with 'task k8s:status'"

  k8s:status:
    desc: Show Kubernetes deployment status
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl is not installed. Run: task deps:check"
    cmds:
      - kubectl -n ic-monitoring get pods,svc,deploy

  k8s:logs:
    desc: Show logs from Kubernetes pods
    cmds:
      - kubectl -n ic-monitoring logs -l app.kubernetes.io/name=ic-server --tail=100 -f

  k8s:port-forward:
    desc: Forward port 8000 from K8s to localhost
    cmds:
      - kubectl -n ic-monitoring port-forward svc/ic-server {{.PORT}}:8000

  k8s:delete:
    desc: Remove deployment from Kubernetes
    cmds:
      - kubectl delete -f {{.K8S_DIR}}/ --ignore-not-found

  # ===========================================================================
  # Kind (local Kubernetes)
  # ===========================================================================

  kind:create:
    desc: Create a local Kubernetes cluster with kind
    preconditions:
      - sh: command -v kind
        msg: |
          kind is not installed.
          Install: curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
                   chmod +x ./kind && mv ./kind ~/.local/bin/
      - sh: command -v docker || command -v podman
        msg: "kind requires docker or podman. Install one first."
    cmds:
      - kind create cluster --name ic-test
      - echo "Cluster created. Deploy with 'task kind:deploy'"

  kind:deploy:
    desc: Build image, load into kind, and deploy
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -q ic-test
        msg: |
          No kind cluster 'ic-test' found.
          Create one first: task kind:create
    cmds:
      - task: build
      - kind load docker-image {{.IMAGE}}:{{.TAG}} --name ic-test
      - task: deploy
      - echo "Deployed to kind. Access with 'task k8s:port-forward'"

  kind:delete:
    desc: Delete the local kind cluster
    cmds:
      - kind delete cluster --name ic-test 2>/dev/null || true

  # ===========================================================================
  # Database
  # ===========================================================================

  db:start:
    desc: Start PostgreSQL container
    preconditions:
      - sh: command -v docker || command -v podman
        msg: "Docker or podman is required to run PostgreSQL."
    cmds:
      - docker start {{.DB_CONTAINER}} 2>/dev/null || docker compose up -d postgres

  db:stop:
    desc: Stop PostgreSQL container
    cmds:
      - docker stop {{.DB_CONTAINER}}

  db:migrate:
    desc: Run database migrations
    dir: db
    cmds:
      - python3 migrate.py

  db:psql:
    desc: Open psql shell
    cmds:
      - docker exec -it {{.DB_CONTAINER}} psql -U postgres konflux_monitoring

  # ===========================================================================
  # Utilities
  # ===========================================================================

  deps:check:
    desc: Check all tool dependencies and report missing ones
    cmds:
      - |
        ok=true
        check() {
          if command -v "$1" > /dev/null 2>&1; then
            printf "  %-14s ✓ %s\n" "$1" "$($1 --version 2>/dev/null | head -1)"
          else
            printf "  %-14s ✗ missing — %s\n" "$1" "$2"
            ok=false
          fi
        }
        echo "Required:"
        check python3      "sudo dnf install python3"
        check ruff         "pip install ruff"
        echo ""
        echo "Docker/Container:"
        check docker       "https://docs.docker.com/engine/install/"
        check podman       "sudo dnf install podman"
        echo ""
        echo "Kubernetes:"
        check kubectl      "https://kubernetes.io/docs/tasks/tools/"
        check kind         "https://kind.sigs.k8s.io/docs/user/quick-start/#installation"
        echo ""
        if [ "$ok" = true ]; then
          echo "All dependencies available."
        else
          echo "Some tools are missing. Install commands shown above."
        fi

  clean:
    desc: Remove build artifacts and caches
    cmds:
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name .pytest_cache -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name .mypy_cache -exec rm -rf {} + 2>/dev/null || true
      - find . -name "*.pyc" -delete 2>/dev/null || true

  clean:docker:
    desc: Remove Docker image
    cmds:
      - docker rmi {{.IMAGE}}:{{.TAG}} 2>/dev/null || true

  health:
    desc: Check server health endpoint
    preconditions:
      - sh: command -v curl
        msg: "curl is required. Install: sudo dnf install curl"
    cmds:
      - "curl -sf http://localhost:{{.PORT}}/health | python3 -m json.tool"

  api:docs:
    desc: Open API docs in browser
    cmds:
      - echo "API docs available at http://localhost:{{.PORT}}/docs"
      - xdg-open "http://localhost:{{.PORT}}/docs" 2>/dev/null || open "http://localhost:{{.PORT}}/docs" 2>/dev/null || true

  # ===========================================================================
  # MCP
  # ===========================================================================

  mcp:setup:
    desc: Generate .mcp.json for Claude Code MCP server
    cmds:
      - |
        ROOT="$(pwd)"
        cat > .mcp.json <<MCPEOF
        {
          "mcpServers": {
            "ic": {
              "type": "stdio",
              "command": "bash",
              "args": [
                "-c",
                "set -a && source ${ROOT}/.env && set +a && cd ${ROOT}/src && exec python3 -m mcp_server 2>/dev/null"
              ],
              "env": {}
            },
            "konflux-docs": {
              "type": "stdio",
              "command": "uvx",
              "args": [
                "--from", "mcpdoc", "mcpdoc",
                "--urls", "Konflux:https://konflux-ci.dev/docs/llms.txt",
                "--transport", "stdio"
              ]
            }
          }
        }
        MCPEOF
      - echo "✓ .mcp.json created. Restart Claude Code to pick up MCP servers."
    status:
      - test -f .mcp.json

  # ===========================================================================
  # Demo
  # ===========================================================================

  demo:
    desc: Run the interactive ic demo via Claude Code
    deps: [demo:preflight]
    cmds:
      - echo "Starting ic demo..."
      - claude -p /demo

  demo:preflight:
    desc: Verify MCP server, database, and .env are ready for demo
    cmds:
      - |
        echo "=== ic Demo Pre-flight Check ==="
        ok=true

        # Check .env
        if [ -f .env ]; then
          printf "  %-24s ✓\n" ".env file"
        else
          printf "  %-24s ✗ missing — copy .env.example to .env\n" ".env file"
          ok=false
        fi

        # Check database
        if docker inspect {{.DB_CONTAINER}} > /dev/null 2>&1 && \
           docker exec {{.DB_CONTAINER}} pg_isready -q 2>/dev/null; then
          printf "  %-24s ✓\n" "PostgreSQL"
        else
          printf "  %-24s ✗ not running — run: task db:start\n" "PostgreSQL"
          ok=false
        fi

        # Check MCP config
        if [ -f .mcp.json ]; then
          printf "  %-24s ✓\n" "MCP config (.mcp.json)"
        else
          printf "  %-24s ✗ missing\n" "MCP config (.mcp.json)"
          ok=false
        fi

        # Check Claude Code
        if command -v claude > /dev/null 2>&1; then
          printf "  %-24s ✓\n" "Claude Code CLI"
        else
          printf "  %-24s ✗ not installed — https://docs.anthropic.com/en/docs/claude-code\n" "Claude Code CLI"
          ok=false
        fi

        echo ""
        if [ "$ok" = true ]; then
          echo "✓ All checks passed. Ready for demo."
        else
          echo "✗ Some checks failed. Fix the issues above before running the demo."
          exit 1
        fi

