apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic-server
  namespace: ic-monitoring
  labels:
    app.kubernetes.io/name: ic-server
    app.kubernetes.io/part-of: ic-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ic-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ic-server
        app.kubernetes.io/part-of: ic-monitoring
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: server
          image: ic-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ic-server-config
            - secretRef:
                name: ic-server-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
