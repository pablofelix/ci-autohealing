[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-tool"
version = "0.2.0"
description = "kubectl-style CLI for CI Auto-Healing — monitors Konflux CI pipelines, AI diagnosis, autonomous fix PRs, 53+ MCP tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Pablo Estevez"}]

dependencies = [
    "click>=8.0",
    "requests>=2.20",
    "rich>=13.0",
]

[project.optional-dependencies]
full = [
    "kubernetes>=28.1",
    "psycopg2-binary>=2.8",
    "python-dotenv>=0.19",
    "pydantic>=2.0",
    "anthropic>=0.90",
    "langfuse>=2.50",
    "fastmcp>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "minio>=7.0",
    "requests-kerberos>=0.14",
]

[project.scripts]
ic = "cli.main:cli"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "conftest.py", "*/test_*.py", "setup.py", "build/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "pass",
    "raise NotImplementedError",
]

[tool.setuptools.packages.find]
where = ["src"]
